<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sonnet Spine (Q版) Test</title>
    <link rel="stylesheet" href="/resources/spine-player/spine-player.min.css">
    <style>
        body { margin: 0; background: #f0f0f0; display: flex; gap: 20px; padding: 20px; }
        #stage { width: 300px; height: 400px; }
        #log { font: 12px monospace; white-space: pre-wrap; max-width: 500px; }
    </style>
</head>
<body>
    <div id="stage"></div>
    <div id="log">loading...</div>
    <script src="/resources/spine-player/spine-player.min.js"></script>
    <script>
        const log = (s) => { document.getElementById("log").textContent += "\n" + s; };
        new spine.SpinePlayer("stage", {
            binaryUrl: "/live2d/sonnet-spine/302301_shisihangshi_p.skel",
            atlasUrl: "/live2d/sonnet-spine/302301_shisihangshi_p.atlas",
            animation: "b_idle",
            showControls: false,
            alpha: true,
            backgroundColor: "#00000000",
            success: (player) => {
                const anims = player.animationState.data.skeletonData.animations.map((a) => a.name);
                log("animations: " + anims.join(", "));
                const idle = anims.find((a) => /idle|daiji|stand/i.test(a)) || anims[0];
                // 必须走 player.setAnimation：它内部会按动画包围盒计算视口
                player.setAnimation(idle, true);
                log("playing: " + idle);
            },
            error: (e) => log("ERROR: " + e),
        });
    </script>
</body>
</html>
