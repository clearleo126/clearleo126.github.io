<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>playtest</title>
</head>
<body>
  <canvas id="game" width="320" height="200"></canvas>
  <div id="overlay"><div id="overlay-root"></div></div>
  <div id="touch"></div>
  <pre id="out">running</pre>
  <script src="../js/audio.js"></script>
  <script src="../js/sprites.js"></script>
  <script src="../js/levels.js"></script>
  <script src="../js/game.js"></script>
  <script>
    const log = [];
    window.HERO.begin(0);
    log.push("t0 " + JSON.stringify(window.HERO.snapshot()));
    log.push("t3 " + JSON.stringify(window.HERO.simulate(3)));
    log.push("t8 " + JSON.stringify(window.HERO.simulate(5)));
    log.push("t14 " + JSON.stringify(window.HERO.simulate(6)));
    log.push("t20 " + JSON.stringify(window.HERO.simulate(6)));
    log.push("t26 " + JSON.stringify(window.HERO.simulate(6)));
    document.getElementById("out").textContent = log.join("\n");
    document.title = log[log.length - 1];
  </script>
</body>
</html>
