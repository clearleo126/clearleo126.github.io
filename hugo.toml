baseURL = 'https://clearleo126.github.io/'
locale = 'zh-CN'
title = 'ClearLeo'
theme = 'hugo-theme-reimu'

defaultContentLanguage = 'zh-CN'

[languages]
[languages.zh-CN]
label = '简体中文'
weight = 1
hasCJKLanguage = true

[markup.highlight]
guessSyntax = true
noClasses = false

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]

[outputFormats.BannerManifest]
baseName = "bannermanifest"
isPlainText = true
mediaType = "application/json"
notAlternative = true

[outputs]
home = ["HTML", "RSS", "BannerManifest"]
